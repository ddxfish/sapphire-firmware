## The parts that come from Espressif's component registry. Versions are
## the ones proven together elsewhere (Xiaozhi, ESPHome), see README.md.
dependencies:
  idf: ">=5.5.3"
  espressif/esp_codec_dev: "~1.6.2"
  espressif/esp-sr: "^2.5.5"
  espressif/led_strip: "~3.0.3"
  espressif/esp_io_expander_tca95xx_16bit: "^2.0.2"
  espressif/esp-tflite-micro: "1.3.3~1"
  espressif/esp-nn: "1.1.2"
  esphome/esp-micro-speech-features: "1.2.3"
  espressif/mdns: "^1.4.0"
  # the glass (0.4.0): LVGL on esp_lvgl_port as the pocket proved on this toolchain
  # (lvgl 9.6, port 2.9), ST7789 is in ESP-IDF itself, the touch chip is a CST816
  lvgl/lvgl: "^9.3"
  espressif/esp_lvgl_port: "^2.6"
  espressif/esp_lcd_touch_cst816s: "^1.1"
  # the eye (0.5.0): the DVP camera driver, JPEG straight from the sensor, autodetects OV2640/OV3660/OV5640
  espressif/esp32-camera: "^2.1.8"
