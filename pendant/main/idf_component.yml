## The parts that come from Espressif's component registry. Versions are the ones the
## speaker board proved on this toolchain (firmware/ai-speaker-mic).
dependencies:
  idf: ">=5.5.3"
  espressif/esp-sr: "^2.5.5"
  espressif/esp-tflite-micro: "1.3.3~1"
  espressif/esp-nn: "1.1.2"
  esphome/esp-micro-speech-features: "1.2.3"
  espressif/mdns: "^1.4.0"
  # the glass: LVGL on esp_lvgl_port; the ST7789 driver is in ESP-IDF itself, the touch chip is a CST816S
  lvgl/lvgl: "^9.3"
  espressif/esp_lvgl_port: "^2.6"
  espressif/esp_lcd_touch_cst816s: "^1.1"
  # the eye: esp32-camera is our patched copy in components/ (not the registry); the S3's SIMD JPEG
  # codec encodes what the GC2145 gives (it makes no JPEG of its own) and decodes her frames
  espressif/esp_new_jpeg: "~1.0.2"
